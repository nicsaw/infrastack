apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    gateway: false
  settings.yaml: |
    title: InfraStack
    disableIndexing: true
  services.yaml: |
    - Infrastructure:
      - Argo CD:
          icon: argocd.png
          description: GitOps Continuous Delivery
          href: /argocd/
    - Media:
        - MeTube:
            icon: metube.png
            description: Video downloader
            href: /metube/
  proxmox.yaml: "{}"
  bookmarks.yaml: "[]"
  widgets.yaml: "[]"
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
