apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    gateway: false
  settings.yaml: |
    title: InfraStack
    disableIndexing: true
  services.yaml: |
    - Infrastructure:
      - Argo CD:
          icon: argocd.png
          description: GitOps Continuous Delivery
          href: /argocd/
    - Automation:
        - n8n:
            icon: n8n.png
            description: Workflow automation
            href: https://n8n.nicholassaw.com/
    - AI:
        - Crawl4AI:
            icon: mdi-spider-web
            description: LLM-ready web crawling API
            href: /crawl4ai
    - Data:
      - pgAdmin:
          icon: pgadmin.png
          description: PostgreSQL administration
          href: /pgadmin/
    - Search:
        - SearXNG:
            icon: searxng.png
            description: Private metasearch
            href: /searxng/
    - Media:
        - MeTube:
            icon: metube.png
            description: Video downloader
            href: /metube/
  proxmox.yaml: "{}"
  bookmarks.yaml: "[]"
  widgets.yaml: "[]"
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
