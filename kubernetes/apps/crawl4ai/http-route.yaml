apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crawl4ai
spec:
  parentRefs:
    - name: homelab
  rules:
    - matches:
        - path:
            type: Exact
            value: /crawl4ai
        - path:
            type: Exact
            value: /crawl4ai/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: crawl4ai
          port: 11235
    - matches:
        - path:
            type: PathPrefix
            value: /crawl4ai/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: crawl4ai
          port: 11235
