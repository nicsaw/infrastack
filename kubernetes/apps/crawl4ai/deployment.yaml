apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
  labels:
    app.kubernetes.io/name: crawl4ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crawl4ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawl4ai
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: crawl4ai
          image: unclecode/crawl4ai
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crawl4ai-auth
                  key: CRAWL4AI_API_TOKEN
            - name: CRAWL4AI_HOOKS_ENABLED
              value: "false"
            - name: CRAWL4AI_EXECUTE_JS_ENABLED
              value: "false"
            - name: GUNICORN_BIND
              value: "0.0.0.0:11235"
          ports:
            - name: http
              containerPort: 11235
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
            - name: temporary
              mountPath: /tmp
            - name: redis-data
              mountPath: /var/lib/redis
            - name: outputs
              mountPath: /var/lib/crawl4ai/outputs
            - name: crawl4ai-home
              mountPath: /home/appuser/.crawl4ai
            - name: url-seeder-cache
              mountPath: /home/appuser/.cache/url_seeder
            - name: gunicorn-state
              mountPath: /home/appuser/.gunicorn
      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
        - name: redis-data
          emptyDir:
            sizeLimit: 1Gi
        - name: outputs
          emptyDir:
            sizeLimit: 2Gi
        - name: crawl4ai-home
          emptyDir:
            sizeLimit: 512Mi
        - name: url-seeder-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: gunicorn-state
          emptyDir:
            sizeLimit: 64Mi
