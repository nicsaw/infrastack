apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: render-config
          image: ghcr.io/searxng/searxng:2026.7.26-b060c780d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              /usr/local/searxng/.venv/bin/python - <<'PY'
              from pathlib import Path
              import secrets

              template = Path('/config-template/settings.yml').read_text()
              rendered = template.replace('__SEARXNG_SECRET__', secrets.token_urlsafe(48))
              Path('/config/settings.yml').write_text(rendered)
              PY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:2026.7.26-b060c780d
          imagePullPolicy: IfNotPresent
          env:
            - name: INFRASTACK_EXTERNAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: homepage-runtime
                  key: external-host
            - name: SEARXNG_BASE_URL
              value: "https://$(INFRASTACK_EXTERNAL_HOST)/searxng/"
            - name: SEARXNG_BIND_ADDRESS
              value: 0.0.0.0
            - name: SEARXNG_PORT
              value: "8080"
            - name: FORCE_OWNERSHIP
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
      volumes:
        - name: config-template
          configMap:
            name: searxng
        - name: config
          emptyDir: {}
        - name: cache
          persistentVolumeClaim:
            claimName: searxng-cache
