---
- name: Configure GitHub Actions Runner Controller
  when: github_runners_enabled | bool
  block:
    - name: Validate GitHub Actions runner configuration
      ansible.builtin.assert:
        that:
          - github_runners_config_url is match('^https://github[.]com/[^/]+/[^/]+/?$')
          - github_runners_scale_set_name | length > 0
          - github_runners_scale_set_name | length <= 45
          - (github_runners_min | int) >= 0
          - (github_runners_max | int) >= (github_runners_min | int)
          - github_runners_storage_class | length > 0
          - github_runners_storage_size | length > 0
          - github_runners_token | length > 0
        fail_msg: >-
          Configure the github_runners_* values in config.yml before enabling the GitHub Actions runner scale set.
      no_log: true

    - name: Check ARC namespaces
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - namespace
          - "{{ github_runners_namespace }}"
      loop:
        - arc-systems
        - arc-runners
      loop_control:
        loop_var: github_runners_namespace
      changed_when: false
      failed_when: false
      register: github_runners_namespace_checks

    - name: Create missing ARC namespaces
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - create
          - namespace
          - "{{ github_runners_namespace_result.github_runners_namespace }}"
      loop: "{{ github_runners_namespace_checks.results }}"
      loop_control:
        loop_var: github_runners_namespace_result
      when: github_runners_namespace_result.rc != 0
      changed_when: true

    - name: Install GitHub runner authentication secret
      block:
        - name: Create a temporary GitHub runner token file
          ansible.builtin.tempfile:
            state: file
            suffix: -github-runner-token
          register: github_runners_token_file
          no_log: true

        - name: Write the GitHub runner token
          ansible.builtin.copy:
            content: "{{ github_runners_token }}"
            dest: "{{ github_runners_token_file.path }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Create or update the GitHub runner authentication secret
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl create secret generic github-runner-auth \
              --namespace=arc-runners \
              --from-file=github_token={{ github_runners_token_file.path | quote }} \
              --dry-run=client \
              --output=yaml \
              | k3s kubectl apply --filename=-
          args:
            executable: /bin/bash
          changed_when: >-
            'created' in github_runners_secret_apply.stdout or
            'configured' in github_runners_secret_apply.stdout
          register: github_runners_secret_apply
          no_log: true
      always:
        - name: Remove the temporary GitHub runner token file
          ansible.builtin.file:
            path: "{{ github_runners_token_file.path | default('') }}"
            state: absent
          when: github_runners_token_file.path | default('') | length > 0
          no_log: true

    - name: Render the ARC controller Application
      ansible.builtin.template:
        src: controller-application.yaml.j2
        dest: /tmp/infrastack-arc-controller-application.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Apply the ARC controller Application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - --filename=/tmp/infrastack-arc-controller-application.yaml
      register: github_runners_controller_apply
      changed_when: >-
        'created' in github_runners_controller_apply.stdout or
        'configured' in github_runners_controller_apply.stdout

    - name: Wait for the ARC controller Application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - application
          - actions-runner-controller
          - --namespace=argocd
          - --output=json
      changed_when: false
      register: github_runners_controller_application
      retries: 120
      delay: 5
      until:
        - >-
          (github_runners_controller_application.stdout | from_json).status.sync.status
          | default('') == 'Synced'
        - >-
          (github_runners_controller_application.stdout | from_json).status.health.status
          | default('') == 'Healthy'

    - name: Render the runner scale set Application
      ansible.builtin.template:
        src: runner-scale-set-application.yaml.j2
        dest: /tmp/infrastack-runner-scale-set-application.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Apply the runner scale set Application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - --filename=/tmp/infrastack-runner-scale-set-application.yaml
      register: github_runners_scale_set_apply
      changed_when: >-
        'created' in github_runners_scale_set_apply.stdout or
        'configured' in github_runners_scale_set_apply.stdout

    - name: Wait for the runner scale set Application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - application
          - github-runners
          - --namespace=argocd
          - --output=json
      changed_when: false
      register: github_runners_scale_set_application
      retries: 120
      delay: 5
      until:
        - >-
          (github_runners_scale_set_application.stdout | from_json).status.sync.status
          | default('') == 'Synced'
        - >-
          (github_runners_scale_set_application.stdout | from_json).status.health.status
          | default('') == 'Healthy'

    - name: Verify the ARC controller deployment
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - rollout
          - status
          - deployment/arc-gha-rs-controller
          - --namespace=arc-systems
          - --timeout=5m
      changed_when: false

    - name: Verify the autoscaling runner set
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - autoscalingrunnerset
          - "{{ github_runners_scale_set_name }}"
          - --namespace=arc-runners
      changed_when: false
