---
n8n_enabled: false
n8n_hostname: ""
n8n_timezone: Australia/Sydney

# Use the existing key before migrating an existing n8n installation.
# Leave empty to generate a key for a fresh installation.
n8n_encryption_key: ""

n8n_storage_class: local-path
n8n_data_storage_size: 10Gi
n8n_files_storage_size: 5Gi
n8n_postgres_storage_size: 20Gi

n8n_cpu_request: 250m
n8n_memory_request: 512Mi
n8n_cpu_limit: "1"
n8n_memory_limit: 2Gi
n8n_runner_cpu_request: 100m
n8n_runner_memory_request: 256Mi
n8n_runner_cpu_limit: 500m
n8n_runner_memory_limit: 512Mi
n8n_postgres_cpu_request: 200m
n8n_postgres_memory_request: 512Mi
n8n_postgres_cpu_limit: "1"
n8n_postgres_memory_limit: 1Gi
