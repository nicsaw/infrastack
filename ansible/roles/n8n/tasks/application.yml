---
- name: Render the n8n HTTPRoute
  ansible.builtin.template:
    src: http-route.yaml.j2
    dest: /tmp/infrastack-n8n-http-route.yaml
    owner: root
    group: root
    mode: "0600"

- name: Render the n8n ReferenceGrant
  ansible.builtin.template:
    src: reference-grant.yaml.j2
    dest: /tmp/infrastack-n8n-reference-grant.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the n8n route resources
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - "--filename={{ item }}"
  loop:
    - /tmp/infrastack-n8n-http-route.yaml
    - /tmp/infrastack-n8n-reference-grant.yaml
  register: n8n_route_apply
  changed_when: >-
    'created' in n8n_route_apply.stdout or
    'configured' in n8n_route_apply.stdout

- name: Render the n8n Argo CD Application
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /tmp/infrastack-n8n-application.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the n8n Argo CD Application
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - --filename=/tmp/infrastack-n8n-application.yaml
  register: n8n_application_apply
  changed_when: >-
    'created' in n8n_application_apply.stdout or
    'configured' in n8n_application_apply.stdout

- name: Wait for the n8n Argo CD Application sync
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - application/n8n
      - --namespace=argocd
      - --output=json
  changed_when: false
  register: n8n_application
  retries: 60
  delay: 5
  until:
    - (n8n_application.stdout | from_json).status.sync.status | default('') == 'Synced'
    - >-
      (n8n_application.stdout | from_json).status.sync.revision | default('')
      ==
      (prerequisites_repository_revision.stdout.split() | first)

- name: Restart n8n PostgreSQL when runtime configuration changed
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - restart
      - statefulset/n8n-postgres
      - --namespace=n8n
  register: n8n_postgres_restart
  changed_when: "'restarted' in n8n_postgres_restart.stdout"
  when: "'configured' in n8n_runtime_config_apply.stdout"

- name: Wait for n8n PostgreSQL after runtime configuration changed
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - statefulset/n8n-postgres
      - --namespace=n8n
      - --timeout=10m
  changed_when: false
  when: "'configured' in n8n_runtime_config_apply.stdout"

- name: Restart n8n when runtime configuration changed
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - restart
      - deployment/n8n
      - --namespace=n8n
  register: n8n_restart
  changed_when: "'restarted' in n8n_restart.stdout"
  when: "'configured' in n8n_runtime_config_apply.stdout"

- name: Display n8n access information
  ansible.builtin.debug:
    msg:
      - "Internal URL: http://n8n.n8n.svc.cluster.local:5678"
      - "External URL: https://{{ n8n_hostname }}/"
      - >-
        Encryption key: sudo kubectl get secret n8n-secrets
        --namespace=n8n
        --output=jsonpath='{.data.N8N_ENCRYPTION_KEY}' | base64 --decode; echo
