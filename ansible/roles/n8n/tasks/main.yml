---
- name: Remove the n8n Argo CD Application when disabled
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - delete
      - "application/{{ n8n_application_name }}"
      - --namespace=argocd
      - --ignore-not-found=true
  register: n8n_disabled_application
  changed_when: "'deleted' in n8n_disabled_application.stdout"
  when: not (n8n_enabled | bool)

- name: Remove n8n runtime resources when disabled
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - delete
      - deployment/n8n
      - statefulset/n8n-postgres
      - service/n8n
      - service/n8n-postgres
      - configmap/n8n-runtime
      - "--namespace={{ n8n_namespace }}"
      - --ignore-not-found=true
  register: n8n_disabled_workloads
  changed_when: "'deleted' in n8n_disabled_workloads.stdout"
  failed_when: false
  when: not (n8n_enabled | bool)

- name: Remove the n8n route when disabled
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - delete
      - httproute/n8n
      - "--namespace={{ n8n_gateway_namespace }}"
      - --ignore-not-found=true
  register: n8n_disabled_route
  changed_when: "'deleted' in n8n_disabled_route.stdout"
  failed_when: false
  when: not (n8n_enabled | bool)

- name: Remove the n8n ReferenceGrant when disabled
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - delete
      - referencegrant/n8n
      - "--namespace={{ n8n_namespace }}"
      - --ignore-not-found=true
  register: n8n_disabled_reference_grant
  changed_when: "'deleted' in n8n_disabled_reference_grant.stdout"
  failed_when: false
  when: not (n8n_enabled | bool)

- name: Configure n8n
  when: n8n_enabled | bool
  block:
    - name: Validate n8n configuration
      ansible.builtin.assert:
        that:
          - n8n_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - n8n_application_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - n8n_encryption_key | length == 0 or n8n_encryption_key | length >= 32
          - not (n8n_route_enabled | bool) or n8n_hostname | length > 0
          - not (n8n_route_enabled | bool) or n8n_hostname is match('^[A-Za-z0-9.-]+$')
          - n8n_protocol in ['http', 'https']
          - (n8n_proxy_hops | int) >= 0
          - (n8n_replicas | int) == 1
          - n8n_gateway_name | length > 0
          - n8n_gateway_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - n8n_timezone | length > 0
          - n8n_postgres_database is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - n8n_postgres_user is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - n8n_storage_class | length > 0
          - n8n_data_storage_size is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei)$')
          - n8n_files_storage_size is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei)$')
          - n8n_postgres_storage_size is match('^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei)$')
          - n8n_image_repository | length > 0
          - n8n_image_tag | length > 0
          - n8n_runner_image_repository | length > 0
          - n8n_postgres_image_repository | length > 0
          - n8n_postgres_image_tag | length > 0
        fail_msg: "Review the n8n settings in config.yaml."
      no_log: true

    - name: Resolve the n8n hostname and protocol
      ansible.builtin.set_fact:
        n8n_resolved_hostname: >-
          {{
            n8n_hostname
            if n8n_route_enabled | bool
            else 'n8n.' ~ n8n_namespace ~ '.svc.cluster.local'
          }}
        n8n_resolved_protocol: >-
          {{ n8n_protocol if n8n_route_enabled | bool else 'http' }}

    - name: Resolve the n8n base URL
      ansible.builtin.set_fact:
        n8n_resolved_base_url: >-
          {{
            n8n_resolved_protocol
            ~ '://'
            ~ n8n_resolved_hostname
            ~ ('' if n8n_route_enabled | bool else ':5678')
          }}

    - name: Create the n8n namespace
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl create namespace {{ n8n_namespace | quote }} \
          --dry-run=client \
          --output=yaml \
          | k3s kubectl apply --filename=-
      args:
        executable: /bin/bash
      register: n8n_namespace_apply
      changed_when: >-
        'created' in n8n_namespace_apply.stdout or
        'configured' in n8n_namespace_apply.stdout

    - name: Read the n8n secret
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - secret/n8n-secrets
          - "--namespace={{ n8n_namespace }}"
          - --output=json
      changed_when: false
      failed_when: false
      register: n8n_secret
      no_log: true

    - name: Validate the existing n8n secret
      ansible.builtin.assert:
        that:
          - "'N8N_ENCRYPTION_KEY' in (n8n_secret.stdout | from_json).data"
          - "'POSTGRES_PASSWORD' in (n8n_secret.stdout | from_json).data"
          - "'N8N_RUNNERS_AUTH_TOKEN' in (n8n_secret.stdout | from_json).data"
        fail_msg: >-
          The existing n8n-secrets Secret is missing a required key.
          Back it up, delete it, and rerun bootstrap.
      when: n8n_secret.rc == 0
      no_log: true

    - name: Create the n8n secret
      when: n8n_secret.rc != 0
      block:
        - name: Generate the n8n encryption key
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "import secrets; print(secrets.token_hex(32))"
          changed_when: false
          register: n8n_generated_encryption_key
          when: n8n_encryption_key | length == 0
          no_log: true

        - name: Resolve the n8n encryption key
          ansible.builtin.set_fact:
            n8n_resolved_encryption_key: >-
              {{
                n8n_encryption_key
                if n8n_encryption_key | length > 0
                else n8n_generated_encryption_key.stdout
              }}
          no_log: true

        - name: Generate the n8n PostgreSQL password
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "import secrets; print(secrets.token_hex(32))"
          changed_when: false
          register: n8n_generated_postgres_password
          no_log: true

        - name: Generate the n8n task runner token
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "import secrets; print(secrets.token_hex(32))"
          changed_when: false
          register: n8n_generated_runner_token
          no_log: true

        - name: Create a temporary n8n secret directory
          ansible.builtin.tempfile:
            state: directory
            suffix: -n8n-secrets
          changed_when: false
          register: n8n_secret_directory
          no_log: true

        - name: Write the n8n encryption key
          ansible.builtin.copy:
            content: "{{ n8n_resolved_encryption_key }}"
            dest: "{{ n8n_secret_directory.path }}/encryption-key"
            owner: root
            group: root
            mode: "0600"
          changed_when: false
          no_log: true

        - name: Write the n8n PostgreSQL password
          ansible.builtin.copy:
            content: "{{ n8n_generated_postgres_password.stdout }}"
            dest: "{{ n8n_secret_directory.path }}/postgres-password"
            owner: root
            group: root
            mode: "0600"
          changed_when: false
          no_log: true

        - name: Write the n8n task runner token
          ansible.builtin.copy:
            content: "{{ n8n_generated_runner_token.stdout }}"
            dest: "{{ n8n_secret_directory.path }}/runner-token"
            owner: root
            group: root
            mode: "0600"
          changed_when: false
          no_log: true

        - name: Install the n8n secret
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl create secret generic n8n-secrets \
              --namespace={{ n8n_namespace | quote }} \
              --from-file=N8N_ENCRYPTION_KEY={{ (n8n_secret_directory.path ~ '/encryption-key') | quote }} \
              --from-file=POSTGRES_PASSWORD={{ (n8n_secret_directory.path ~ '/postgres-password') | quote }} \
              --from-file=N8N_RUNNERS_AUTH_TOKEN={{ (n8n_secret_directory.path ~ '/runner-token') | quote }} \
              --dry-run=client \
              --output=yaml \
              | k3s kubectl apply --filename=-
          args:
            executable: /bin/bash
          register: n8n_secret_apply
          changed_when: >-
            'created' in n8n_secret_apply.stdout or
            'configured' in n8n_secret_apply.stdout
          no_log: true
      always:
        - name: Remove the temporary n8n secret directory
          ansible.builtin.file:
            path: "{{ n8n_secret_directory.path | default('') }}"
            state: absent
          when: n8n_secret_directory.path | default('') | length > 0
          changed_when: false
          no_log: true

    - name: Render the n8n runtime configuration
      ansible.builtin.template:
        src: runtime-config.yaml.j2
        dest: /tmp/infrastack-n8n-runtime-config.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Apply the n8n runtime configuration
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - --filename=/tmp/infrastack-n8n-runtime-config.yaml
      register: n8n_runtime_config_apply
      changed_when: >-
        'created' in n8n_runtime_config_apply.stdout or
        'configured' in n8n_runtime_config_apply.stdout

    - name: Render the n8n HTTPRoute
      ansible.builtin.template:
        src: http-route.yaml.j2
        dest: /tmp/infrastack-n8n-http-route.yaml
        owner: root
        group: root
        mode: "0600"
      when: n8n_route_enabled | bool

    - name: Render the n8n ReferenceGrant
      ansible.builtin.template:
        src: reference-grant.yaml.j2
        dest: /tmp/infrastack-n8n-reference-grant.yaml
        owner: root
        group: root
        mode: "0600"
      when: n8n_route_enabled | bool

    - name: Apply the n8n route resources
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - --filename={{ item }}
      loop:
        - /tmp/infrastack-n8n-http-route.yaml
        - /tmp/infrastack-n8n-reference-grant.yaml
      register: n8n_route_apply
      changed_when: >-
        'created' in n8n_route_apply.stdout or
        'configured' in n8n_route_apply.stdout
      when: n8n_route_enabled | bool

    - name: Remove the n8n HTTPRoute when private routing is disabled
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - delete
          - httproute/n8n
          - "--namespace={{ n8n_gateway_namespace }}"
          - --ignore-not-found=true
      register: n8n_route_delete
      changed_when: "'deleted' in n8n_route_delete.stdout"
      when: not (n8n_route_enabled | bool)

    - name: Remove the n8n ReferenceGrant when private routing is disabled
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - delete
          - referencegrant/n8n
          - "--namespace={{ n8n_namespace }}"
          - --ignore-not-found=true
      register: n8n_reference_grant_delete
      changed_when: "'deleted' in n8n_reference_grant_delete.stdout"
      when: not (n8n_route_enabled | bool)

    - name: Render the n8n Argo CD Application
      ansible.builtin.template:
        src: application.yaml.j2
        dest: /tmp/infrastack-n8n-application.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Apply the n8n Argo CD Application
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - apply
          - --filename=/tmp/infrastack-n8n-application.yaml
      register: n8n_application_apply
      changed_when: >-
        'created' in n8n_application_apply.stdout or
        'configured' in n8n_application_apply.stdout

    - name: Wait for the n8n Argo CD Application sync
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - "application/{{ n8n_application_name }}"
          - --namespace=argocd
          - --output=json
      changed_when: false
      register: n8n_application
      retries: 60
      delay: 5
      until:
        - (n8n_application.stdout | from_json).status.sync.status | default('') == 'Synced'
        - >-
          (n8n_application.stdout | from_json).status.sync.revision | default('')
          ==
          (prerequisites_repository_revision.stdout.split() | first)

    - name: Display n8n access information
      ansible.builtin.debug:
        msg:
          - "Internal URL: http://n8n.{{ n8n_namespace }}.svc.cluster.local:5678"
          - >-
            External URL: {{ n8n_resolved_base_url
            if n8n_route_enabled | bool
            else 'disabled' }}
          - >-
            Encryption key: sudo kubectl get secret n8n-secrets
            --namespace={{ n8n_namespace }}
            --output=jsonpath='{.data.N8N_ENCRYPTION_KEY}' | base64 --decode; echo
