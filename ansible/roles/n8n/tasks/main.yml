---
- name: Validate n8n configuration
  ansible.builtin.assert:
    that:
      - n8n_encryption_key | length == 0 or n8n_encryption_key | length >= 32
    fail_msg: >-
      Set n8n_encryption_key in config.yaml to the existing n8n encryption key
      or leave it empty for a fresh installation.
  no_log: true

- name: Create the n8n namespace
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl create namespace {{ n8n_namespace | quote }} \
      --dry-run=client \
      --output=yaml \
      | k3s kubectl apply --filename=-
  args:
    executable: /bin/bash
  register: n8n_namespace_apply
  changed_when: >-
    'created' in n8n_namespace_apply.stdout or
    'configured' in n8n_namespace_apply.stdout

- name: Read the n8n secret
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - secret/n8n-secrets
      - "--namespace={{ n8n_namespace }}"
      - --output=json
  changed_when: false
  failed_when: false
  register: n8n_secret
  no_log: true

- name: Validate the existing n8n secret
  ansible.builtin.assert:
    that:
      - "'N8N_ENCRYPTION_KEY' in (n8n_secret.stdout | from_json).data"
      - "'POSTGRES_PASSWORD' in (n8n_secret.stdout | from_json).data"
      - "'N8N_RUNNERS_AUTH_TOKEN' in (n8n_secret.stdout | from_json).data"
    fail_msg: >-
      The existing n8n-secrets Secret is missing one or more required keys.
      Back it up, delete it, and rerun bootstrap.
  when: n8n_secret.rc == 0
  no_log: true

- name: Create the n8n secret
  when: n8n_secret.rc != 0
  block:
    - name: Generate the n8n encryption key
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import secrets; print(secrets.token_hex(32))"
      changed_when: false
      register: n8n_generated_encryption_key
      when: n8n_encryption_key | length == 0
      no_log: true

    - name: Resolve the n8n encryption key
      ansible.builtin.set_fact:
        n8n_resolved_encryption_key: >-
          {{
            n8n_encryption_key
            if n8n_encryption_key | length > 0
            else n8n_generated_encryption_key.stdout
          }}
      no_log: true

    - name: Generate the n8n PostgreSQL password
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import secrets; print(secrets.token_hex(32))"
      changed_when: false
      register: n8n_generated_postgres_password
      no_log: true

    - name: Generate the n8n task runner token
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import secrets; print(secrets.token_hex(32))"
      changed_when: false
      register: n8n_generated_runner_token
      no_log: true

    - name: Create a temporary n8n secret directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -n8n-secrets
      changed_when: false
      register: n8n_secret_directory
      no_log: true

    - name: Write the n8n encryption key
      ansible.builtin.copy:
        content: "{{ n8n_resolved_encryption_key }}"
        dest: "{{ n8n_secret_directory.path }}/encryption-key"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Write the n8n PostgreSQL password
      ansible.builtin.copy:
        content: "{{ n8n_generated_postgres_password.stdout }}"
        dest: "{{ n8n_secret_directory.path }}/postgres-password"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Write the n8n task runner token
      ansible.builtin.copy:
        content: "{{ n8n_generated_runner_token.stdout }}"
        dest: "{{ n8n_secret_directory.path }}/runner-token"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Install the n8n secret
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl create secret generic n8n-secrets \
          --namespace={{ n8n_namespace | quote }} \
          --from-file=N8N_ENCRYPTION_KEY={{ (n8n_secret_directory.path ~ '/encryption-key') | quote }} \
          --from-file=POSTGRES_PASSWORD={{ (n8n_secret_directory.path ~ '/postgres-password') | quote }} \
          --from-file=N8N_RUNNERS_AUTH_TOKEN={{ (n8n_secret_directory.path ~ '/runner-token') | quote }} \
          --dry-run=client \
          --output=yaml \
          | k3s kubectl apply --filename=-
      args:
        executable: /bin/bash
      register: n8n_secret_apply
      changed_when: >-
        'created' in n8n_secret_apply.stdout or
        'configured' in n8n_secret_apply.stdout
      no_log: true
  always:
    - name: Remove the temporary n8n secret directory
      ansible.builtin.file:
        path: "{{ n8n_secret_directory.path | default('') }}"
        state: absent
      when: n8n_secret_directory.path | default('') | length > 0
      changed_when: false
      no_log: true

- name: Display the n8n secret commands
  ansible.builtin.debug:
    msg:
      - >-
        Encryption key: sudo kubectl get secret n8n-secrets --namespace=n8n
        --output=jsonpath='{.data.N8N_ENCRYPTION_KEY}' | base64 --decode; echo
      - >-
        Database password: sudo kubectl get secret n8n-secrets --namespace=n8n
        --output=jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode; echo
