---
- name: Read existing n8n storage requests
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - "{{ item.resource }}"
      - --namespace=n8n
      - "--output=jsonpath={{ item.jsonpath }}"
      - --ignore-not-found=true
  loop:
    - resource: pvc/n8n-data
      jsonpath: "{.spec.resources.requests.storage}"
    - resource: pvc/n8n-files
      jsonpath: "{.spec.resources.requests.storage}"
    - resource: statefulset/n8n-postgres
      jsonpath: "{.spec.volumeClaimTemplates[0].spec.resources.requests.storage}"
  changed_when: false
  register: n8n_existing_storage

- name: Validate existing n8n storage requests
  ansible.builtin.assert:
    that:
      - >-
        n8n_existing_storage.results[0].stdout | length == 0 or
        n8n_existing_storage.results[0].stdout == n8n_data_storage_size
      - >-
        n8n_existing_storage.results[1].stdout | length == 0 or
        n8n_existing_storage.results[1].stdout == n8n_files_storage_size
      - >-
        n8n_existing_storage.results[2].stdout | length == 0 or
        n8n_existing_storage.results[2].stdout == n8n_postgres_storage_size
    fail_msg: >-
      Existing n8n storage requests must match the configured capacity.
      Changing a storage size requires a documented migration or recreation.
