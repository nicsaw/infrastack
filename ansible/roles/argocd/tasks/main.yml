---
- name: Check for the Argo CD namespace
  ansible.builtin.command: k3s kubectl get namespace argocd
  changed_when: false
  failed_when: false
  register: argocd_namespace

- name: Create the Argo CD namespace
  ansible.builtin.command: k3s kubectl create namespace argocd
  when: argocd_namespace.rc != 0
  changed_when: true

- name: Install Argo CD stable
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - apply
      - --namespace=argocd
      - --server-side
      - --force-conflicts
      - --filename=https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout"
  retries: 3
  delay: 10
  until: argocd_apply.rc == 0

- name: Read the Argo CD server path
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - configmap/argocd-cmd-params-cm
      - --namespace=argocd
      - --output=jsonpath={.data.server\.basehref}{"\n"}{.data.server\.rootpath}{"\n"}{.data.server\.insecure}
  changed_when: false
  register: argocd_server_path

- name: Configure the Argo CD server path
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - patch
      - configmap/argocd-cmd-params-cm
      - --namespace=argocd
      - --type=merge
      - --patch={"data":{"server.basehref":"/argocd","server.rootpath":"/argocd","server.insecure":"true"}}
  changed_when: true
  when: argocd_server_path.stdout_lines != ["/argocd", "/argocd", "true"]
  notify: Restart the Argo CD server

- name: Apply Argo CD server changes
  ansible.builtin.meta: flush_handlers

- name: Wait for the Argo CD server rollout
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/argocd-server
      - --namespace=argocd
      - --timeout=5m
  changed_when: false

- name: Wait for Argo CD deployments
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - wait
      - --namespace=argocd
      - --for=condition=Available
      - deployment
      - --all
      - --timeout=5m
  changed_when: false
