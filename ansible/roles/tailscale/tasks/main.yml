---
- name: Check for Tailscale
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary

- name: Download the official Tailscale installer
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
  when: not tailscale_binary.stat.exists
  register: tailscale_installer
  retries: 3
  delay: 5
  until: tailscale_installer is succeeded

- name: Install Tailscale
  ansible.builtin.command: /bin/sh /tmp/tailscale-install.sh
  when: not tailscale_binary.stat.exists
  changed_when: true
  register: tailscale_install
  retries: 3
  delay: 5
  until: tailscale_install.rc == 0

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read initial Tailscale status
  ansible.builtin.command: tailscale status --json
  changed_when: false
  failed_when: false
  register: tailscale_initial_tailscale_status

- name: Read the initial Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_initial_backend_state: >-
      {{
        (
          tailscale_initial_tailscale_status.stdout
          | from_json
        ).BackendState
        if tailscale_initial_tailscale_status.rc == 0
        else 'Unknown'
      }}

- name: Connect Tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --timeout=2s
  changed_when: true
  register: tailscale_up
  when: tailscale_initial_backend_state != "Running"
  failed_when:
    - tailscale_up.rc != 0
    - >-
      (
        (
          tailscale_up.stdout
          ~ '\n'
          ~ tailscale_up.stderr
        )
        | regex_search(
          'https://login\.tailscale\.com/[A-Za-z0-9/?&._=%:+~-]+'
        )
        | default('', true)
        | length
      ) == 0

- name: Read the Tailscale authentication URL
  ansible.builtin.set_fact:
    tailscale_auth_url: >-
      {{
        (
          tailscale_up.stdout
          ~ '\n'
          ~ tailscale_up.stderr
        )
        | regex_search(
          'https://login\.tailscale\.com/[A-Za-z0-9/?&._=%:+~-]+'
        )
        | default('', true)
      }}
  when: tailscale_initial_backend_state != "Running"

- name: Require a usable Tailscale authentication URL before prompting
  ansible.builtin.assert:
    that:
      - tailscale_auth_url is match('^https://login\.tailscale\.com/')
    fail_msg: "Tailscale did not provide a usable HTTPS authentication URL."
  when: tailscale_auth_url | default('') | length > 0

- name: Display the Tailscale authentication URL
  ansible.builtin.debug:
    msg: "Authenticate this server at {{ tailscale_auth_url }}"
  when: tailscale_auth_url | default('') | length > 0

- name: Wait for the user to authenticate Tailscale
  ansible.builtin.pause:
    prompt: "Open the URL above, authenticate this server, then press Enter"
  when: tailscale_auth_url | default('') | length > 0

- name: Wait for the Tailscale backend
  ansible.builtin.command: tailscale status --json
  changed_when: false
  register: tailscale_connected_tailscale_status
  retries: 30
  delay: 2
  until:
    - tailscale_connected_tailscale_status.rc == 0
    - (tailscale_connected_tailscale_status.stdout | from_json).BackendState == "Running"

- name: Enable Tailscale SSH
  ansible.builtin.command: tailscale set --ssh
  changed_when: false

- name: Verify Tailscale
  ansible.builtin.import_tasks: verify.yml
