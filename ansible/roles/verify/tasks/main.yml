---
- name: Read service state
  ansible.builtin.service_facts:

- name: Require running host services
  ansible.builtin.assert:
    that:
      - ansible_facts.services["tailscaled.service"].state == "running"
      - ansible_facts.services["k3s.service"].state == "running"
    fail_msg: "tailscaled and k3s must both be running."

- name: Verify the Kubernetes node
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - wait
      - --for=condition=Ready
      - nodes
      - --all
      - --timeout=60s
  changed_when: false

- name: Verify Homepage deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/homepage
      - --namespace=default
      - --timeout=5m
  changed_when: false

- name: Verify MeTube deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/metube
      - --namespace=default
      - --timeout=5m
  changed_when: false

- name: Verify pgAdmin deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/pgadmin
      - --namespace=default
      - --timeout=5m
  changed_when: false

- name: Verify SearXNG deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/searxng
      - --namespace=default
      - --timeout=5m
  changed_when: false

- name: Verify Crawl4AI deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/crawl4ai
      - --namespace=default
      - --timeout=15m
  changed_when: false

- name: Verify n8n PostgreSQL
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - statefulset/n8n-postgres
      - --namespace=n8n
      - --timeout=10m
  changed_when: false
  when: n8n_enabled | bool

- name: Verify n8n deployment
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - rollout
      - status
      - deployment/n8n
      - --namespace=n8n
      - --timeout=10m
  changed_when: false
  when: n8n_enabled | bool

- name: Verify local Homepage
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
  register: verify_local_homepage
  retries: 12
  delay: 5
  until: verify_local_homepage.status == 200

- name: Verify local MeTube
  ansible.builtin.uri:
    url: http://127.0.0.1/metube/
    status_code: 200
  register: verify_local_metube
  retries: 12
  delay: 5
  until: verify_local_metube.status == 200

- name: Verify local pgAdmin
  ansible.builtin.uri:
    url: http://127.0.0.1/pgadmin/
    status_code: 200
  register: verify_local_pgadmin
  retries: 30
  delay: 5
  until: verify_local_pgadmin.status == 200

- name: Verify local SearXNG
  ansible.builtin.uri:
    url: http://127.0.0.1/searxng/
    status_code: 200
  register: verify_local_searxng
  retries: 30
  delay: 5
  until: verify_local_searxng.status == 200

- name: Verify local Crawl4AI
  ansible.builtin.uri:
    url: http://127.0.0.1/crawl4ai/health
    status_code: 200
  register: verify_local_crawl4ai
  retries: 120
  delay: 5
  until: verify_local_crawl4ai.status == 200

- name: Verify local n8n route
  ansible.builtin.uri:
    url: http://127.0.0.1/healthz
    headers:
      Host: "{{ n8n_hostname }}"
    status_code: 200
  register: verify_local_n8n
  retries: 120
  delay: 5
  until: verify_local_n8n.status == 200
  when: n8n_enabled | bool

- name: Verify private Homepage
  ansible.builtin.uri:
    url: "https://{{ tailscale_dns_name }}/"
    status_code: 200
    validate_certs: true
  register: verify_private_homepage
  retries: 12
  delay: 5
  until: verify_private_homepage.status == 200

- name: Verify private MeTube
  ansible.builtin.uri:
    url: "https://{{ tailscale_dns_name }}/metube/"
    status_code: 200
    validate_certs: true
  register: verify_private_metube
  retries: 12
  delay: 5
  until: verify_private_metube.status == 200

- name: Verify private pgAdmin
  ansible.builtin.uri:
    url: "https://{{ tailscale_dns_name }}/pgadmin/"
    status_code: 200
    validate_certs: true
  register: verify_private_pgadmin
  retries: 30
  delay: 5
  until: verify_private_pgadmin.status == 200

- name: Verify private SearXNG
  ansible.builtin.uri:
    url: "https://{{ tailscale_dns_name }}/searxng/"
    status_code: 200
    validate_certs: true
  register: verify_private_searxng
  retries: 30
  delay: 5
  until: verify_private_searxng.status == 200

- name: Verify private Crawl4AI
  ansible.builtin.uri:
    url: "https://{{ tailscale_dns_name }}/crawl4ai/health"
    status_code: 200
    validate_certs: true
  register: verify_private_crawl4ai
  retries: 120
  delay: 5
  until: verify_private_crawl4ai.status == 200

- name: Print access URLs
  ansible.builtin.debug:
    msg:
      - "Homepage: https://{{ tailscale_dns_name }}/"
      - "MeTube: https://{{ tailscale_dns_name }}/metube/"
      - "pgAdmin: https://{{ tailscale_dns_name }}/pgadmin/"
      - "SearXNG: https://{{ tailscale_dns_name }}/searxng/"
      - "Crawl4AI API: https://{{ tailscale_dns_name }}/crawl4ai/"

- name: Print the n8n access URL
  ansible.builtin.debug:
    msg: "n8n: https://{{ n8n_hostname }}/"
  when: n8n_enabled | bool
