cluster_name: homelab
repository_url: auto
repository_revision: main

# Optional - GitHub Actions Runner Controller scale set.
github_runners_enabled: false
github_runners_config_url: https://github.com/OWNER/REPOSITORY
github_runners_scale_set_name: k3s-runners
github_runners_min: 0
github_runners_max: 3
github_runners_token: ""

# Optional - pgAdmin administrator login email.
pgadmin_default_email: admin@infrastack.dev

# Optional - n8n with a dedicated PostgreSQL instance and task-runner sidecar.
n8n_enabled: false
n8n_namespace: n8n
n8n_application_name: n8n
n8n_route_enabled: false
n8n_hostname: ""
n8n_protocol: https
n8n_proxy_hops: 1
n8n_gateway_name: homelab
n8n_gateway_namespace: default
n8n_external_verify_enabled: false
n8n_timezone: UTC
n8n_postgres_database: n8n
n8n_postgres_user: n8n

# Use the existing key before migrating n8n data. Leave empty for a fresh install.
n8n_encryption_key: ""

n8n_image_repository: docker.n8n.io/n8nio/n8n
n8n_image_tag: "2.30.5"
n8n_runner_image_repository: n8nio/runners
n8n_postgres_image_repository: postgres
n8n_postgres_image_tag: "18"

n8n_replicas: 1
n8n_storage_class: local-path
n8n_data_storage_size: 10Gi
n8n_files_storage_size: 5Gi
n8n_postgres_storage_size: 20Gi

n8n_cpu_request: 250m
n8n_memory_request: 512Mi
n8n_cpu_limit: "1"
n8n_memory_limit: 2Gi
n8n_runner_cpu_request: 100m
n8n_runner_memory_request: 256Mi
n8n_runner_cpu_limit: 500m
n8n_runner_memory_limit: 512Mi
n8n_postgres_cpu_request: 200m
n8n_postgres_memory_request: 512Mi
n8n_postgres_cpu_limit: "1"
n8n_postgres_memory_limit: 1Gi
